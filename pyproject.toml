[project]
name = "audio-processing"
version = "0.1.0"
description = "Pipeline modular para procesado de campañas acústicas"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "soundfile",
    "tqdm",
    "audio-metadata",
    "pyfilterbank",

    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"